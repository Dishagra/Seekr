# Requires metrics-server, and requires Postgres: scaling past one replica on
# SQLite means several pods writing to one file.
#
# Ranking is CPU work in Python over a capped candidate pool, so CPU is the
# signal that actually tracks load here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seekr
  namespace: seekr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seekr
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
