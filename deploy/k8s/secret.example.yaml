# TEMPLATE — do not commit real values, and do not `kubectl apply` this file.
#
# The two required values have no safe default: without RIP_API_TOKEN every
# /v1 route answers without credentials, and without RIP_DATABASE_URL the app
# falls back to a SQLite file inside the pod, which is empty and disappears on
# restart.
#
# Create the real Secret out of band:
#
#   kubectl -n seekr create secret generic seekr \
#     --from-literal=RIP_API_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=RIP_DATABASE_URL='postgresql+psycopg://USER:PASS@HOST:5432/seekr' \
#     --from-literal=GITHUB_TOKEN='ghp_...' \
#     --from-literal=OPENALEX_MAILTO='data@yourdomain.com'
#
# Or point External Secrets / the Secrets Store CSI driver at the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: seekr
  namespace: seekr
type: Opaque
stringData:
  RIP_API_TOKEN: "replace-me"
  RIP_DATABASE_URL: "postgresql+psycopg://user:pass@host:5432/seekr"
  GITHUB_TOKEN: ""
  OPENALEX_MAILTO: ""
  # Optional, and only read if present. Every one of these buys either a
  # higher rate limit or a source the free tier cannot reach; none is required
  # to run the service.
  # EXA_API_KEY: ""                 # people search over professional profiles (metered)
  # TAVILY_API_KEY: ""              # web search
  # SERPAPI_API_KEY: ""             # web search, alternative
  # SEMANTIC_SCHOLAR_API_KEY: ""    # higher scholarly rate limit
  # STACKEXCHANGE_KEY: ""           # higher Stack Overflow rate limit
  # SCRAPINGBEE_API_KEY: ""         # render service, used only where robots.txt allows
  # ZENROWS_API_KEY: ""             # render service, alternative
  # SEEKR_SEARCH_TTL_DAYS: "7"      # how long a paid search is reused before re-buying
  # RIP_VOCAB_TTL: "300"            # seconds the query vocabulary is cached
  # RIP_CANDIDATE_POOL: ""          # resolution candidate cap
