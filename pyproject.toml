[project]
name = "rip"
version = "0.1.0"
description = "Resource Intelligence Platform - evidence-backed resource data layer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rip", "rip.connectors"]
package-dir = {"" = "backend"}

[tool.pytest.ini_options]
# the package lives under backend/, so tests import it from there
pythonpath = ["backend"]
testpaths = ["backend/tests"]
